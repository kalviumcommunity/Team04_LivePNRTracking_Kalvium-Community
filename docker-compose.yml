version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railway_pnr_app
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/railway_pnr?schema=public
      - AUTH_SECRET=a_secret_key_at_least_32_characters_long_for_authjs_pnr_tracking
      - ADMIN_SECRET_KEY=RAILWAY-ADMIN-SECURE-2026
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: railway_pnr_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: railway_pnr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
